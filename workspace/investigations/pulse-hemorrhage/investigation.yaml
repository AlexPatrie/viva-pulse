question: 'How does the whole-body Pulse engine respond to a hemorrhage: how does
  the response scale with bleed severity, does closed-loop fluid resuscitation change
  it, and does the same bleed behave the same across Pulse''s 21 shipped patients?

  '
hypothesis: 'Blood loss scales with severity while the baroreflex holds arterial pressure
  until the bleed is severe; a MAP-targeted infusion preserves blood volume and pressure;
  and every shipped patient compensates the same way, with smaller patients losing
  a larger fraction of their blood.

  '
description: 'Three studies on the pulse_hemorrhage and pulse_resuscitation composites,
  run through the workbench and recorded in each study''s runs.db. Their pass criteria
  are pytest files in each study''s tests/ directory, fixed before the canonical runs
  and after the pilots recorded in workspace/experiments/_runs.yaml.

  '
scientific_argument:
  main_claim: Pulse's baroreflex holds arterial pressure against mild bleeds by raising
    heart rate, and loses it once the bleed is severe.
  evidence_for:
  - hemorrhage-severity-sweep F-01, F-02
  - patient-cohort F-01 (at severity 0.8, every patient raises heart rate and loses
    MAP)
  evidence_against: []
  key_figures:
  - hemorrhage-severity-sweep/viz/severity-response.html
  - patient-cohort/viz/cohort-blood-loss.html
  - fluid-resuscitation/viz/comparative_map-by-arm.html
  caveats:
  - One bleed site (RightLeg) and 10-minute runs throughout.
  - Pulse is deterministic, so each condition is one run.
  - The cohort criteria and the severity criteria at 0.2 and 0.8 were set after a
    deterministic pilot of the same configurations.
biological_story: 'A bleed lowers blood volume, which lowers the blood returning to
  the heart and so the volume it can pump per beat. The baroreflex senses the falling
  pressure and raises heart rate, which holds arterial pressure up while the loss
  is modest. In these runs that compensation held pressure within about a millimetre
  of mercury up to severity 0.4 (823 mL lost in 10 minutes); beyond that, cardiac
  output kept falling and pressure followed. Across patients the same bleed removes
  1.1 to 1.8 L while starting blood volume spans 2.9 to 7.1 L, so smaller patients
  lose a larger share of their blood.

  '
