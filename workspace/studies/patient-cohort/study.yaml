readouts:
- name: mean-arterial-pressure
  store_path: vitals.mean_arterial_pressure_mmHg
  units: mmHg
  status: available
- name: heart-rate
  store_path: vitals.heart_rate_bpm
  units: 1/min
  status: available
- name: blood-volume
  store_path: vitals.blood_volume_mL
  units: mL
  status: available
- name: total-hemorrhaged-volume
  store_path: vitals.total_hemorrhaged_volume_mL
  units: mL
  status: available
- name: cardiac-output
  store_path: vitals.cardiac_output_L_per_min
  units: L/min
  status: available
- name: irreversible-state
  store_path: vitals.irreversible_state
  status: available
  description: Pulse reported an irreversible state; the engine is no longer advanced.
expected_behavior:
- name: every-patient-compensates
  observable: vitals.blood_volume_mL, vitals.heart_rate_bpm, vitals.mean_arterial_pressure_mmHg
  condition: in all 21 patients blood volume and MAP fall and heart rate rises
  test: tests/test_cohort.py::test_every_patient_bleeds_and_compensates
- name: smaller-patients-lose-larger-fraction
  observable: vitals.total_hemorrhaged_volume_mL / initial vitals.blood_volume_mL
  condition: Spearman rank correlation with starting blood volume <= -0.7
  test: tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
robustness:
  n_replicates: 1
  parameter_sweep: true
  note: Pulse is deterministic; the cohort is a sweep over the patient state file.
preregistered:
  registered_at: '2026-10-23'
  criteria:
  - tests/test_cohort.py::test_every_shipped_patient_ran
  - tests/test_cohort.py::test_every_patient_bleeds_and_compensates
  - tests/test_cohort.py::test_smaller_patients_lose_a_larger_fraction
  predictions:
  - 'Pilot probe (direct pulse_hemorrhage runs, 600 s): all 21 states load; fraction lost ranges 23.8%
    (Overweight) to 38.1% (Underweight); Spearman rank correlation of fraction lost with starting blood
    volume is -0.91.'
  thresholds_provenance: The -0.7 correlation threshold is set below that pilot value; the qualitative
    criteria follow from the hypothesis.
falsifiability: 'Refuted if any patient fails to load or run, if any patient''s blood volume,

  heart rate or MAP moves the other way, or if the rank correlation of fraction

  lost with starting blood volume is above -0.7.

  '
limitations:
- The 21 patients are Pulse's shipped examples, not a population sample.
- The same severity number does not mean the same bleeding rate in every patient.
