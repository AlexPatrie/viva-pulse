[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "viva-pulse"
version = "0.5.0"
description = "Process-bigraph wrapper for the Kitware Pulse Physiology Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Alex Patrie", email = "alexanderpatrie@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Pulse itself is not on PyPI: build it from source (see README.md) and point
# PULSE_INSTALL_DIR at the install prefix. These are the runtime deps of
# Pulse's own Python API; protobuf must match the Pulse build (7.35.x).
dependencies = [
    "bigraph-schema>=1.8",
    "process-bigraph>=1.10",
    "numpy",
    "pandas",
    "protobuf",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest", "plotly", "bigraph-viz"]

[tool.hatch.build.targets.wheel]
packages = ["viva_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
